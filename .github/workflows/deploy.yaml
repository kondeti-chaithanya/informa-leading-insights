name: Sync Static Assets to DEV S3

on:
  pull_request:
    branches:
      - dev
    types:
      - closed

jobs:
  sync-assets:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Detect which folder changed
      - name: Detect changed folders
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            aviation:
              - 'public/aviation/**'
            connect:
              - 'public/connect/**'
            sli:
              - 'public/sli/**'
            investor_insights:
              - 'public/investor-insights/**'

      # 3️⃣ Configure AWS credentials (DEV)
      - name: Configure AWS Credentials (DEV)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 4️⃣ Sync aviation
      - name: Sync aviation
        if: steps.filter.outputs.aviation == 'true'
        run: |
          aws s3 sync public/aviation/ s3://${{ secrets.S3_BUCKET_NAME }}/aviation/ --delete --size-only

      # 5️⃣ Sync connect
      - name: Sync connect
        if: steps.filter.outputs.connect == 'true'
        run: |
          aws s3 sync public/connect/ s3://${{ secrets.S3_BUCKET_NAME }}/connect/ --delete --size-only

      # 6️⃣ Sync sli
      - name: Sync sli
        if: steps.filter.outputs.sli == 'true'
        run: |
          aws s3 sync public/sli/ s3://${{ secrets.S3_BUCKET_NAME }}/sli/ --delete --size-only

      # 7️⃣ Sync investor-insights
      - name: Sync investor-insights
        if: steps.filter.outputs.investor_insights == 'true'
        run: |
          aws s3 sync public/investor-insights/ s3://${{ secrets.S3_BUCKET_NAME }}/investor-insights/ --delete --size-only
